[plugin]
id = "com.local.disk-bill"
name = "Disk Bill"
version = "0.1.0"
author = "local"
description = "Show installed game sizes, cold installs, and leftover shader caches. Read-only."

[assets]
resources = []

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[frontend.globals]

[webkit]
entry = "webview/preload.ts"

[compiler]
# "auto" installs into the local Millennium plugins directory.
# "dist" keeps the build inside this repo until you opt in.
output_path = "dist"

[dev]
auto_restart = true
reload_steamui_when = "both"

[inspect]
depth = 4
colors = true
show_hidden = false

[logger]
padding = 0
backend_prefix = "BCK"
frontend_prefix = "FRT"
webview_prefix = "WEB"

[patches]
debug = false
